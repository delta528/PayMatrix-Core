apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend
  namespace: production
  labels:
    app: java-backend
    tier: core-ledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-backend
  template:
    metadata:
      labels:
        app: java-backend
    spec:
      containers:
      - name: java-backend
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/java-backend:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1024Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: java-backend-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: java-backend
  ports:
  - port: 8080
    targetPort: 8080