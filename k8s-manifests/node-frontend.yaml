apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-frontend
  namespace: production
  labels:
    app: node-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-frontend
  template:
    metadata:
      labels:
        app: node-frontend
    spec:
      containers:
      - name: node-frontend
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/node-frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: node-frontend-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: node-frontend
  ports:
  - port: 3000
    targetPort: 3000