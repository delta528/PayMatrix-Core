apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-microservice
  namespace: production
  labels:
    app: go-microservice
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-microservice
  template:
    metadata:
      labels:
        app: go-microservice
    spec:
      containers:
      - name: go-microservice
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/go-microservice:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: go-microservice
  ports:
  - port: 8080
    targetPort: 8080