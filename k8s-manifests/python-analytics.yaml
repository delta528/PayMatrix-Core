apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-analytics
  namespace: production
  labels:
    app: python-analytics
    tier: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-analytics
  template:
    metadata:
      labels:
        app: python-analytics
    spec:
      containers:
      - name: python-analytics
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/python-analytics:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: python-analytics-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: python-analytics
  ports:
  - port: 5000
    targetPort: 5000